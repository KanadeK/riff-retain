[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "riff-retain"
version = "0.1.0"
description = "Read-only WAVE chunk retention contracts across metadata edits and exports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/KanadeK/riff-retain"
Issues = "https://github.com/KanadeK/riff-retain/issues"

[project.scripts]
riff-retain = "riff_retain.cli:main"

[project.optional-dependencies]
dev = ["build==1.3.0", "coverage==7.10.7", "ruff==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["riff_retain"]
branch = true
